name: Android cloud APK

on:
  push:
    branches: [industrial-android]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: Mindustry
    env:
      # Upstream uses CI=true to configure its private release keystore.
      # This job produces a debug APK and must not request that key.
      CI: 'false'
    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          ref: ${{ github.event_name == 'workflow_dispatch' && 'industrial-android' || github.sha }}
          persist-credentials: false

      - name: Checkout matching Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          ref: 7445105cd2683daf5b9ac7033ebb07265d3e814d
          path: Arc
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install exact Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Locate M3 test signing key
        run: echo "MINDUSTRY_DEBUG_KEYSTORE=$RUNNER_TEMP/mindustry-industrial-m3.keystore" >> "$GITHUB_ENV"

      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ${{ env.MINDUSTRY_DEBUG_KEYSTORE }}
          key: mindustry-industrial-m3-signing-v2

      - name: Initialize persistent M3 test signing key
        run: |
          if [ ! -f "$MINDUSTRY_DEBUG_KEYSTORE" ]; then
            echo '::error::M3 signing key unavailable. Restore the existing key; do not replace it or uninstall the app.'
            exit 1
          fi
          keytool -exportcert -keystore "$MINDUSTRY_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey \
            | sha256sum | grep '^61254fd2280bf34aa64bd06405cf0e2bc9b2d8fe7df4cc615c39983bcdfd8086 '

      - name: Record build inputs
        run: |
          mkdir -p build-evidence
          {
            echo "Mindustry commit: $(git rev-parse HEAD)"
            echo "Upstream base: 17012d61d9e4c3cbd9820d87e81c24495486ac53 (v160.7)"
            echo "Arc commit: $(git -C ../Arc rev-parse HEAD)"
            java -version 2>&1
            cat gradle/wrapper/gradle-wrapper.properties
            grep -E 'com.android.tools.build:gradle|compileSdk|targetSdkVersion|minSdkVersion|buildToolsVersion' android/build.gradle
            sdkmanager --list_installed
          } | tee build-evidence/versions.txt

      - name: Test gameplay and build signed debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --version 2>&1 | tee build-evidence/gradle-version.txt
          ./gradlew tests:test --no-daemon --max-workers=2 --stacktrace \
            -Pbuildversion=160.7 -PversionType=industrial-m5 -PandroidVersionCode=5 \
            2>&1 | tee build-evidence/tests.log
          # Prepare atlases before Android merges assets on a clean runner.
          ./gradlew tools:pack --no-daemon --max-workers=2 --stacktrace \
            -Pbuildversion=160.7 -PversionType=industrial-m5 -PandroidVersionCode=5 \
            2>&1 | tee build-evidence/sprite-pack.log
          ./gradlew android:assembleDebug --no-daemon --max-workers=2 --stacktrace \
            -Pbuildversion=160.7 -PversionType=industrial-m5 -PandroidVersionCode=5 \
            2>&1 | tee build-evidence/build.log

      - name: Verify APK and prepare download
        run: |
          mapfile -t apks < <(find android/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          mkdir -p dist
          cp "${apks[0]}" dist/Mindustry-Industrial-v160.7-m5.apk
          apk=dist/Mindustry-Industrial-v160.7-m5.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" \
            | tee build-evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" \
            > build-evidence/apk-alignment.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" \
            | tee build-evidence/apk-badging.txt
          grep -E "package: name='io.anuke.mindustry.industrial.m3'" build-evidence/apk-badging.txt
          unzip -Z1 "$apk" > build-evidence/apk-contents.txt
          grep -E '^lib/arm64-v8a/.*\.so$' build-evidence/apk-contents.txt
          grep -E '^assets/sprites/sprites\.aatls$' build-evidence/apk-contents.txt
          (cd dist && sha256sum Mindustry-Industrial-v160.7-m5.apk > SHA256SUMS.txt)
          cp LICENSE dist/LICENSE
          git archive --format=tar.gz --output=dist/mindustry-corresponding-source.tar.gz HEAD
          git -C ../Arc archive --format=tar.gz --output="$PWD/dist/arc-corresponding-source.tar.gz" HEAD
          cp ../Arc/LICENSE dist/LICENSE-Arc-Apache-2.0.txt
          cp docs/ANDROID_CLOUD_FR.md dist/INSTALLATION-ANDROID.md
          {
            echo "Source: https://github.com/$GITHUB_REPOSITORY/tree/$(git rev-parse HEAD)"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Arc: https://github.com/Anuken/Arc/tree/7445105cd2683daf5b9ac7033ebb07265d3e814d"
            echo 'Mission 5: Industrial UI filters; recipes, sector progression and previous saves retained. Unofficial debug test APK.'
          } > dist/BUILD-INFO.txt
          {
            echo '## APK Android prêt'
            echo 'Télécharger l’artefact **Mindustry-Industrial-Android** en bas de cette page, extraire le ZIP puis ouvrir le fichier APK.'
            echo 'Clé de test uniquement ; ne pas utiliser pour une distribution de production.'
            echo '### SHA-256'
            cat dist/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-Industrial-Android
          path: Mindustry/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-evidence
          path: Mindustry/build-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload gameplay test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gameplay-test-reports
          path: |
            Mindustry/tests/build/reports/tests/test/
            Mindustry/tests/build/test-results/test/
          if-no-files-found: warn
          retention-days: 30
